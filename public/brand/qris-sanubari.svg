  <rect x="75" y="340" width="65" height="65" rx="10" fill="#0F172A" />
  <rect x="85" y="350" width="45" height="45" rx="6" fill="#ffffff" />
  <rect x="94" y="359" width="27" height="27" rx="4" fill="#0F172A" />

