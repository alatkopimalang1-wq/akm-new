    <path d="M 0 24 L 0 0 L 18 0 C 24 0 28 4 28 10 C 28 14 26 17 22 19 L 29 24 L 20 24 L 14.5 19.5 L 6.5 19.5 L 6.5 24 Z M 6.5 14 L 17 14 C 19.5 14 21.5 12.5 21.5 10 C 21.5 7.5 19.5 6 17 6 L 6.5 6 Z" fill="#EE2E24"/>
    <path d="M 33 24 L 33 0 L 40 0 L 40 24 Z" fill="#EE2E24"/>
    <path d="M 45 24 L 45 0 L 52 0 L 52 24 Z" fill="#1E293B"/>
    <path d="M 57 24 L 57 19 L 68 6 L 57 6 L 57 0 L 76 0 L 76 5 L 65 18 L 76 18 L 76 24 Z" fill="#1E293B"/>
  </g>
  <text x="200" y="66" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1.5">NATIONAL QR CODE STANDARD</text>

  <line x1="25" y1="78" x2="375" y2="78" stroke="#F1F5F9" stroke-width="2" />

  <!-- Merchant Info -->
