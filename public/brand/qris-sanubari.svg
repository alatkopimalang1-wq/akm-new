  <g transform="translate(190, 270)">
    <path d="M 3 5 C 3 13 8 16 14 16 C 18 16 20 13 20 5 Z" fill="#291811" />
    <path d="M 20 7 C 22 7 23 8 23 10 C 23 12 21 13 19 13" fill="none" stroke="#291811" stroke-width="2" stroke-linecap="round" />
    <path d="M 6 1 C 6 3 7 3 7 4" fill="none" stroke="#9A6941" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 11 1 C 11 3 12 3 12 4" fill="none" stroke="#9A6941" stroke-width="1.5" stroke-linecap="round" />
