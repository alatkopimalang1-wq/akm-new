  <!-- Top-Left Finder Pattern -->
  <rect x="75" y="155" width="65" height="65" rx="10" fill="#0F172A" />
  <rect x="85" y="165" width="45" height="45" rx="6" fill="#ffffff" />
  <rect x="94" y="174" width="27" height="27" rx="4" fill="#0F172A" />

  <!-- Top-Right Finder Pattern -->
  <rect x="260" y="155" width="65" height="65" rx="10" fill="#0F172A" />
  <rect x="270" y="165" width="45" height="45" rx="6" fill="#ffffff" />
  <rect x="279" y="174" width="27" height="27" rx="4" fill="#0F172A" />

