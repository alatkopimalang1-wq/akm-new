    <rect x="110" y="265" width="30" height="10" rx="2" />
    <rect x="150" y="250" width="10" height="30" rx="2" />
    <rect x="170" y="255" width="25" height="10" rx="2" />
    <rect x="205" y="245" width="10" height="35" rx="2" />
    <rect x="225" y="255" width="20" height="15" rx="2" />
    <rect x="255" y="250" width="25" height="10" rx="2" />
    <rect x="290" y="255" width="15" height="25" rx="2" />

