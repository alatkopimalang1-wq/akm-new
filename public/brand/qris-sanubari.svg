    <rect x="150" y="395" width="35" height="10" rx="2" />
    <rect x="195" y="390" width="25" height="15" rx="2" />
    <rect x="230" y="395" width="20" height="10" rx="2" />
    <rect x="260" y="390" width="15" height="15" rx="2" />
