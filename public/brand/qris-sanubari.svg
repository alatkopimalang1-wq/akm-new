    <rect x="115" y="280" width="20" height="20" rx="2" />
    <rect x="145" y="290" width="15" height="10" rx="2" />
    <rect x="170" y="275" width="10" height="30" rx="2" />
    <rect x="190" y="290" width="30" height="10" rx="2" />
    <rect x="230" y="280" width="20" height="20" rx="2" />
    <rect x="260" y="275" width="15" height="30" rx="2" />
    <rect x="285" y="290" width="40" height="10" rx="2" />

    <rect x="85" y="315" width="20" height="10" rx="2" />
    <rect x="115" y="310" width="15" height="15" rx="2" />
    <rect x="140" y="315" width="25" height="10" rx="2" />
    <rect x="175" y="310" width="35" height="10" rx="2" />
    <rect x="220" y="315" width="15" height="20" rx="2" />
    <rect x="245" y="310" width="30" height="10" rx="2" />
    <rect x="285" y="315" width="20" height="15" rx="2" />

